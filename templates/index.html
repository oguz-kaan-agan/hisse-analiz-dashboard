<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hisse Senedi Analiz Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #e6edf3;
            --accent-green: #00ff88;
            --accent-blue: #00aaff;
            --border-color: #30363d;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-green);
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 30px;
            color: var(--text-color);
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
            justify-content: center;
        }

        .input-box {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--accent-blue);
        }

        input {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            font-family: 'JetBrains Mono', monospace;
            width: 120px;
        }
        
        input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        button {
            background-color: var(--accent-green);
            color: var(--bg-color);
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #00cc6a;
        }
        
        button:active {
            transform: scale(0.98);
        }

        .results {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .result-item h3 {
            margin: 0;
            color: var(--accent-blue);
            font-size: 14px;
        }

        .result-item p {
            margin: 10px 0 0;
            font-size: 24px;
            font-weight: bold;
        }

        .grafik-container img {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }
        
        .error {
            color: #ff5555;
            background-color: rgba(255, 85, 85, 0.1);
            border: 1px solid #ff5555;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📈 Hisse Senedi Analiz</h1>
        <p class="subtitle">Gerçek zamanlı borsa verisi ile teknik analiz</p>

        <div class="card">
            <form method="POST">
                <div class="form-group">
                    <div class="input-box">
                        <label for="ticker">Hisse Sembolü</label>
                        <input type="text" id="ticker" name="ticker" value="{{ ticker|default('AAPL') }}" required>
                    </div>
                    <div class="input-box">
                        <label for="rsi_period">RSI Periyodu</label>
                        <input type="number" id="rsi_period" name="rsi_period" value="{{ rsi_period|default(14) }}" min="1">
                    </div>
                    <div class="input-box">
                        <label for="ma1_period">MA1 Periyodu</label>
                        <input type="number" id="ma1_period" name="ma1_period" value="{{ ma1_period|default(20) }}" min="1">
                    </div>
                    <div class="input-box">
                        <label for="ma2_period">MA2 Periyodu</label>
                        <input type="number" id="ma2_period" name="ma2_period" value="{{ ma2_period|default(50) }}" min="1">
                    </div>
                    <button type="submit">Analiz Et</button>
                </div>
            </form>
        </div>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        {% if grafik %}
        <div class="card">
            <div class="results">
                <div class="result-item">
                    <h3>Son Fiyat ({{ ticker }})</h3>
                    <p>${{ "%.2f"|format(son_fiyat) }}</p>
                </div>
                <div class="result-item">
                    <h3>RSI ({{ rsi_period }})</h3>
                    <p>{{ "%.2f"|format(son_rsi) }}</p>
                </div>
                <div class="result-item">
                    <h3>Sinyal</h3>
                    <p style="color: {% if 'ALINMIŞ' in signal %}#ff5555{% elif 'SATILMIŞ' in signal %}var(--accent-green){% else %}var(--text-color){% endif %}">
                        {{ signal }}
                    </p>
                </div>
            </div>
            
            <div class="grafik-container">
                <img src="data:image/png;base64,{{ grafik }}" alt="Analiz Grafiği">
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
